[workspace]
resolver = "3"
members = ["randomizer/game", "randomizer/logic", "randomizer/cosmetics", "randomizer/core", "randomizer/mem", "randomizer/os", "randomizer/cli", "web"]

[workspace.package]
version = "0.8.2"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/ootrando/ootrr"

# The release the nightlies lead up to: they are built as <next>-nightly.<date>.<run>.
# Without it, a nightly previews the patch after the version above (0.8.2 -> 0.8.3).
[workspace.metadata.nightly]
next = "0.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
